<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAHAB × Cliptx — عرض تسويقي استراتيجي</title>
  <style>body{margin:0;background:#F6F6FB;font-family:Arial,sans-serif}.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#0A003F;font-size:18px}</style>
</head>
<body>
<div class="loading">جاري تحميل العرض...</div>
<script>
(async()=>{
  try{
    const files=['part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt','part-07.txt','part-08.txt'];
    const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f);return r.text();}));
    document.open();
    document.write(parts.join(''));
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading">تعذر تحميل العرض. حاول تحديث الصفحة.</div>';
  }
})();
</script>
</body>
</html>
